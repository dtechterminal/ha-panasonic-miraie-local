name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pytest-asyncio cryptography asyncssh==2.24.1 aiohttp ruff
      - run: ruff check .
      - run: pytest -q
